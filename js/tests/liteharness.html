<!doctype html>
<!-- Lite Viewer harness (3.5.0). Driven by lite_viewer.test.mjs. -->
<html lang="en">
<head><meta charset="utf-8"><title>Radiance Lite harness</title>
<style>html,body{margin:0;background:#222}.host{width:720px;height:460px}</style>
</head>
<body>
<script type="module">
import "../radiance_lite_viewer.js";
const ext = (globalThis.__exts || []).find((e) => e.name === 'FXTD.RadianceLiteViewer');
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
let ready = false;
class FakeNode {
    constructor() {
        this.id = Math.floor(Math.random() * 1e6); this.size = [720, 460];
        this.host = document.createElement('div'); this.host.className = 'host'; document.body.appendChild(this.host);
    }
    addDOMWidget(name, type, el) { this.host.appendChild(el); return { name, type, element: el }; }
}
function px(v, x, y) {
    const d = v.ctx.getImageData(Math.round(x), Math.round(y), 1, 1).data;
    return [d[0], d[1], d[2]];
}
window.__lite = async function (message, { mode = 'single', clip = false } = {}) {
    const out = { ok: false };
    try {
        if (!ready) { await ext.beforeRegisterNodeDef(FakeNode, { name: 'RadianceLiteViewer' }); ready = true; }
        const node = new FakeNode();
        node.onNodeCreated();
        const v = node.radianceLiteViewer;
        await sleep(100);
        await v.load(message);
        v.mode = mode; v.showClip = clip; v.render();
        // let the float proxies land
        for (let i = 0; i < 60; i++) { await sleep(50); if (!(mode === 'diff' || clip) || [...v._derived.values()].some((x) => x && x !== 'pending')) break; }
        v.render();
        const f = v.frames[0];
        const cx = v.panX + f.image.naturalWidth * v.zoom / 2, cy = v.panY + f.image.naturalHeight * v.zoom / 2;
        out.centre = px(v, cx, cy);
        const rect = v.canvas.getBoundingClientRect();
        out.dpr = v.dpr; out.canvasW = v.canvas.width; out.cssW = rect.width;
        v.canvas.dispatchEvent(new PointerEvent('pointermove', { clientX: rect.left + cx / v.dpr, clientY: rect.top + cy / v.dpr, bubbles: true }));
        await sleep(300);
        out.readout = v.readout.textContent;
        v.oneToOne(); out.zoom11 = v.zoom;
        out.fps = v.fps; out.status = v.statusEl.textContent;
        out.ok = true;
    } catch (e) { out.error = String(e && e.stack || e); }
    return out;
};
window.__ready = true;
</script>
</body>
</html>
